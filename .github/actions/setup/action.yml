name: "Setup environment"
description: "Sets up Node.js and installs dependencies; the package's prepare script builds dist/"

inputs:
  ignore-scripts:
    description: >-
      Skip install scripts, both dependencies' and this package's prepare script (so dist/ is not
      built). For privileged jobs, so dependency code can't run with their credentials at install.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: "npm"

    - name: Install dependencies
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        set -euo pipefail
        if [[ "$IGNORE_SCRIPTS" == "true" ]]; then
          npm ci --ignore-scripts
        else
          npm ci # Runs prepare, which builds dist/
        fi
