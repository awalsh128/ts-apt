name: Publish Release

# Releases are always gated by CI:
# - staging: ci.yml calls this after all CI jobs pass, releasing a candidate (e.g. 1.2.0-rc.1).
# - main: promote.yml starts this after fast-forwarding main to a CI-passed staging commit,
#   releasing an official version (e.g. 1.2.0).
# - Manual runs first require a successful CI run for the commit.
on:
  workflow_call:
    secrets:
      RELEASE_BOT_PK:
        description: "Private key of the release-bot app, which pushes release tags"
        required: true
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the release process without publishing anything or pushing tags"
        required: false
        default: "false"

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.semantic-release.outputs.version }} # Empty when nothing was released
    # One release per branch at a time; never cancel one that is tagging.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read # For checking CI results on manual runs
      contents: write # For tags
      pages: read # For configure-pages to read the Pages site settings
      id-token: write # For OIDC: npm trusted publishing
      issues: write # For semantic-release comments
      pull-requests: write # For semantic-release comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Crucial for semantic-release to analyze history
          persist-credentials: false

      - name: Require CI success
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}

      - name: Setup
        uses: ./.github/actions/setup

      # GitHub rejects tag creation by GITHUB_TOKEN here ("creations being restricted"), so the tag is
      # pushed with the release-bot app token, which promote.yml also uses to update main.
      - name: Create release-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PK }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Also builds the API docs (see release.config.ts) and sets the 'version' output when it
      # releases.
      - name: Publish with semantic-release
        id: semantic-release
        shell: bash
        run: npm run release -- ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}
        env:
          # semantic-release pushes the tag with GIT_CREDENTIALS and calls the GitHub API with
          # GITHUB_TOKEN. npm publishing on main uses trusted publishing (OIDC), so no npm token.
          GIT_CREDENTIALS: x-access-token:${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only official releases update the docs site. Dry runs and runs that release nothing leave
      # the 'version' output empty.
      - name: Setup Pages
        if: ${{ github.ref == 'refs/heads/main' && steps.semantic-release.outputs.version != '' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && steps.semantic-release.outputs.version != '' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/api

  # Deploys in its own job so it can use the github-pages environment, which records each deployment
  # and only allows main. The release job can't use it because it also runs on staging.
  deploy-pages:
    needs: release
    if: ${{ github.ref == 'refs/heads/main' && needs.release.outputs.version != '' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # For GitHub Pages deployment
      id-token: write # For OIDC verification of the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
