name: Publish Release

# Releases are always gated by CI:
# - staging: ci.yml calls this after all CI jobs pass, releasing a candidate (e.g. 1.2.0-rc.1).
# - main: promote.yml starts this after fast-forwarding main to a CI-passed staging commit,
#   releasing an official version (e.g. 1.2.0).
# - Manual runs first require a successful CI run for the commit.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the release process without publishing anything or pushing tags"
        required: false
        default: "false"

jobs:
  release:
    runs-on: ubuntu-latest
    # One release per branch at a time; never cancel one that is tagging.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read # For checking CI results on manual runs
      contents: write # For tags
      pages: write # For GitHub Pages deployment
      id-token: write # For OIDC verification (required for Pages)
      issues: write # For semantic-release comments
      pull-requests: write # For semantic-release comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Crucial for semantic-release to analyze history
          persist-credentials: false

      - name: Require CI success
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Publish with semantic-release
        shell: bash
        run: npm run release -- ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate API docs
        if: ${{ github.ref == 'refs/heads/main' }}
        run: npm run docs:api

      - name: Setup Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && inputs.dry-run != 'true' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/api

      - name: Deploy to GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' && inputs.dry-run != 'true' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
