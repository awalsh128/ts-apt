# Promotes staging to main by fast-forwarding main to staging's latest commit, then starts the
# official release. main never gets commits of its own (no merge, squash or release commits), so it
# is always an ancestor of staging.
name: Promote staging to main

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write # Read CI runs and start the release workflow
    steps:
      # main's ruleset only lets the release-bot app update it, so main is pushed with its token.
      - name: Create release-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PK }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve staging commit
        id: staging
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # CI on a staging push also releases the candidate, so success means it was released too.
      - name: Require CI success on staging
        uses: ./.github/actions/require-ci-success
        with:
          sha: ${{ steps.staging.outputs.sha }}
          token: ${{ github.token }}

      - name: Fast-forward main to staging
        env:
          STAGING_SHA: ${{ steps.staging.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor origin/main "$STAGING_SHA"; then
            echo "::error::main has commits that are not on staging, so it can't be fast-forwarded."
            echo "Get those commits onto staging through a pull request, then promote again."
            exit 1
          fi
          # Not a force push, so the remote rejects anything but a fast-forward. Uses the
          # release-bot token persisted by checkout.
          git push origin "$STAGING_SHA:refs/heads/main"

      # Starting the release on main makes semantic-release cut an official release, not a candidate.
      - name: Start official release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run release.yml --ref main
