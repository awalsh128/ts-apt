# This workflow is triggered when a pull request is merged into the main branch and prevents drift.
name: PR Merge Sync (main -> staging)

on:
  pull_request:
    branches:
      - main
    types:
      - closed # Triggers when PR is closed or merged
  # Allow manual fixes in case of accidental drift or other issues.
  workflow_dispatch:

jobs:
  sync-main-staging:
    if: ${{ (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'staging') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Reset Staging to Main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout staging
          git reset --hard origin/main
          git push origin staging --force-with-lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
