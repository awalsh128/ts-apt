# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

# Tokens for release.yml to push release tags, which the tag ruleset only lets the Octo STS app do.
# Octo STS reads this file from the default branch (staging), and only the release workflow running
# on main or staging matches. See CONTRIBUTING.md.
issuer: https://token.actions.githubusercontent.com
subject_pattern: "repo:awalsh128/ts-apt:.*"
claim_pattern:
  ref: "refs/heads/(main|staging)"
  job_workflow_ref: "awalsh128/ts-apt/\\.github/workflows/release\\.yml@refs/heads/(main|staging)"

permissions:
  contents: write
