name: Feature request
description: Suggest an improvement for the ts-apt npm package
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the feature you want.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case is currently hard, verbose, or unsupported?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: The API change, behavior, or command flow you want. An API sketch helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including workarounds you use today.
  - type: dropdown
    id: breaking
    attributes:
      label: Breaking change
      options: [No, Yes, Unsure]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, examples, related issues, or prior art.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: This belongs in ts-apt (APT and dpkg logic), not in a downstream consumer.
          required: true
