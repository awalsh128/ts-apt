name: Bug report
description: Report a bug in the ts-apt npm package
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing what is wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact steps and commands, with a minimal script or test case if possible.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error text and stack trace.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ts-apt version
      placeholder: 1.2.3
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node -v`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and APT version
      description: For example, Ubuntu 24.04 and the output of `apt --version`.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related packages, CI logs, or recent upgrades.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed secrets and private data from all output.
          required: true
